<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MAFA Subjects</title><link rel="stylesheet" href="{{url_for('static',filename='style.css')}}"></head><body><main class="dash"><header><div><b class="brand">MAFA</b><h1>Subjects</h1></div><a class="logout" href="{{url_for('auth.logout')}}">Logout</a></header><nav><a href="{{url_for('admin_routes.dashboard')}}">Dashboard</a><a class="active" href="{{url_for('admin_routes.subjects_page')}}">Subjects</a><a href="{{url_for('admin_routes.users_page')}}">Administrators</a></nav><section class="panel"><h2>Add Subject</h2><form class="inline"><input name="name" formmethod="post" placeholder="New subject" required><button formmethod="post">Add</button></form>{% for cat,msg in get_flashed_messages(with_categories=true) %}<div class="alert {{cat}}">{{msg}}</div>{% endfor %}</section><section class="panel table"><table><tr><th>Subject</th><th>Attendance Records</th></tr>{% for s in subjects %}<tr><td>{{s.name}}</td><td>{{s['count']}}</td></tr>{% endfor %}</table></section></main></body></html>
