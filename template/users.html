<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MAFA Administrators</title><link rel="stylesheet" href="{{url_for('static',filename='style.css')}}"></head><body><main class="dash"><header><div><b class="brand">MAFA</b><h1>Administrators</h1></div><a class="logout" href="{{url_for('auth.logout')}}">Logout</a></header><nav><a href="{{url_for('admin_routes.dashboard')}}">Dashboard</a><a href="{{url_for('admin_routes.subjects_page')}}">Subjects</a><a class="active" href="{{url_for('admin_routes.users_page')}}">Administrators</a></nav><section class="panel"><h2>Create Administrator</h2><form class="filters" method="post"><div><label>Username</label><input name="username" required></div><div><label>Password</label><input name="password" type="password" minlength="8" required></div><div><label>Role</label><select name="role"><option value="subject_admin">Subject Administrator</option><option value="super_admin">Super Administrator</option></select></div><div><label>Subject</label><select name="subject_id"><option value="">Select subject</option>{% for s in subjects %}<option value="{{s.id}}">{{s.name}}</option>{% endfor %}</select></div><button>Create</button></form>{% for cat,msg in get_flashed_messages(with_categories=true) %}<div class="alert {{cat}}">{{msg}}</div>{% endfor %}</section><section class="panel table"><table><tr><th>Username</th><th>Role</th><th>Subject</th></tr>{% for u in users %}<tr><td>{{u.username}}</td><td>{{u.role}}</td><td>{{u.subject_name or 'All subjects'}}</td></tr>{% endfor %}</table></section></main></body></html>
